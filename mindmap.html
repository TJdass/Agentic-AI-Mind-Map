<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic History — Mind Map</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;--surface3:#26262e;
  --border:#2a2a35;--border2:#38384a;
  --text:#f0eee8;--text2:#9896a0;--text3:#555560;
  --gold:#c9a84c;--gold2:#e8c76a;--gold-glow:rgba(201,168,76,0.12);--gold-dim:rgba(201,168,76,0.04);
  --purple:#7b68ee;--purple2:#9d8fff;
  --teal:#4ecdc4;--coral:#ff6b6b;--green:#6bcb77;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Syne',sans-serif;color:var(--text);cursor:default}

#header{
  position:fixed;top:0;left:0;right:0;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:rgba(13,13,15,0.88);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  z-index:1000;
}
.logo{font-size:15px;font-weight:700;letter-spacing:-0.3px;color:var(--gold2);display:flex;align-items:center;gap:10px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pdot 2s ease-in-out infinite}
@keyframes pdot{0%,100%{box-shadow:0 0 8px var(--gold)}50%{box-shadow:0 0 16px var(--gold)}}
.header-center{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.schip{padding:5px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .18s;letter-spacing:.3px}
.schip:hover{border-color:var(--gold);color:var(--gold)}
.schip.active{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.hactions{display:flex;align-items:center;gap:8px}
.btn-g{padding:6px 14px;background:transparent;border:1px solid var(--border2);border-radius:6px;font-family:'Syne',sans-serif;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .18s;letter-spacing:.3px}
.btn-g:hover{border-color:var(--gold);color:var(--gold)}
.btn-p{padding:6px 14px;background:var(--gold);border:none;border-radius:6px;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;color:#0d0d0f;cursor:pointer;transition:all .18s;letter-spacing:.3px}
.btn-p:hover{background:var(--gold2);transform:translateY(-1px)}

#canvas-wrap{position:fixed;top:52px;left:0;right:0;bottom:0}
#canvas{width:100%;height:100%;cursor:grab;display:block}
#canvas.panning{cursor:grabbing}
#canvas.ndrag{cursor:move}

#tip{position:fixed;padding:8px 12px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;font-size:12px;font-weight:500;color:var(--text);pointer-events:none;z-index:800;opacity:0;transition:opacity .15s;max-width:240px;line-height:1.5;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#tip.show{opacity:1}

#panel{
  position:fixed;top:52px;right:0;width:320px;height:calc(100vh - 52px);
  background:rgba(20,20,26,0.97);backdrop-filter:blur(24px);
  border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);
  z-index:500;display:flex;flex-direction:column;overflow:hidden;
}
#panel.open{transform:translateX(0)}
#ph{padding:20px 20px 16px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
#pcls{position:absolute;top:16px;right:16px;width:28px;height:28px;background:var(--surface3);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
#pcls:hover{color:var(--text);border-color:var(--border2)}
#ptag{font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
#ptitle{font-size:20px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:8px;letter-spacing:-.3px;padding-right:30px}
#pmeta{display:flex;gap:6px;flex-wrap:wrap}
.mchip{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500;letter-spacing:.3px}
.mchip.fh{background:rgba(201,168,76,.15);color:var(--gold2)}
.mchip.fm{background:rgba(78,205,196,.12);color:var(--teal)}
.mchip.fl{background:rgba(150,150,170,.1);color:var(--text2)}
.mchip.fu{background:rgba(123,104,238,.15);color:var(--purple2)}
.mchip.fc{background:var(--surface3);color:var(--text2)}
#pbody{flex:1;overflow-y:auto;padding:0}
#pbody::-webkit-scrollbar{width:3px}
#pbody::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.psec{padding:14px 20px;border-bottom:1px solid var(--border)}
.psec:last-child{border-bottom:none}
.slbl{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.stext{font-size:13px;color:var(--text2);line-height:1.8}
.citem{padding:9px 12px 9px 24px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:12px;color:var(--text2);line-height:1.6;cursor:default;position:relative}
.citem::before{content:'';position:absolute;left:10px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.srcrd{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;transition:border-color .15s}
.srcrd:hover{border-color:var(--border2)}
.stbdg{display:inline-block;padding:2px 7px;background:var(--surface3);border-radius:3px;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stitle{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.stitle-link{display:block;font-size:13px;font-weight:600;color:var(--gold2);margin-bottom:4px;text-decoration:none;transition:color .15s}
.stitle-link:hover{color:var(--gold);text-decoration:underline}
.sdesc{font-size:11px;color:var(--text2);line-height:1.6}
.spgrid{display:flex;flex-wrap:wrap;gap:6px}
.sppill{padding:5px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s}
.sppill:hover{border-color:var(--purple);color:var(--purple2);background:rgba(123,104,238,.08)}

#controls{position:fixed;bottom:24px;left:24px;display:flex;flex-direction:column;gap:4px;z-index:400}
.cbtn{width:36px;height:36px;background:rgba(22,22,26,.92);backdrop-filter:blur(8px);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'Syne Mono',monospace}
.cbtn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}

#stats{position:fixed;bottom:24px;right:24px;display:flex;gap:10px;z-index:400;font-size:10px;color:var(--text3);font-family:'Syne Mono',monospace;letter-spacing:.5px}

#legend{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(22,22,26,.88);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:10px;color:var(--text3);z-index:400;letter-spacing:.3px;white-space:nowrap}
.litem{display:flex;align-items:center;gap:5px}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

#empty{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
#empty.hidden{display:none}
.etitle{font-size:32px;font-weight:700;color:var(--text3);letter-spacing:-1px}
.esub{font-size:13px;color:var(--text3);line-height:1.8;text-align:center}
</style>
</head>
<body>

<div id="header">
  <div class="logo"><div class="logo-dot"></div>Agentic History</div>
  <div class="header-center" id="schips"></div>
  <div class="hactions">
    <button class="btn-g" onclick="resetView()">Reset view</button>
    <button class="btn-p" onclick="window.open('history-ai.html')">+ New session</button>
  </div>
</div>

<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div id="tip"></div>

<div id="panel">
  <div id="ph">
    <button id="pcls" onclick="closePanel()">×</button>
    <div id="ptag">Topic</div>
    <div id="ptitle">—</div>
    <div id="pmeta"></div>
  </div>
  <div id="pbody"></div>
</div>

<div id="controls">
  <button class="cbtn" onclick="zoomBy(1.18)">+</button>
  <button class="cbtn" onclick="zoomBy(0.85)">−</button>
  <button class="cbtn" onclick="resetView()" style="font-size:12px">⊙</button>
</div>

<div id="stats"><span id="sn">0 nodes</span><span>·</span><span id="se">0 edges</span></div>

<div id="legend">
  <div class="litem"><div class="ldot" style="background:var(--gold)"></div>Umbrella</div>
  <div class="litem"><div class="ldot" style="background:var(--purple)"></div>Topic</div>
  <div class="litem"><div class="ldot" style="background:var(--teal)"></div>Connection</div>
  <div class="litem" style="color:var(--text3)">· Drag nodes · Scroll to zoom · Click to explore</div>
</div>

<div id="empty">
  <div class="etitle">No sessions yet</div>
  <div class="esub">Run a recording through the pipeline<br>and your map will appear here automatically.</div>
</div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W=0, H=0;
let camX=0, camY=0, camZ=1;
let nodes=[], edges=[];
let sessions=[], activeIdx=0;
let clickCounts={};
let hoveredNode=null, selectedNode=null, draggingNode=null;
let panning=false, panStart={x:0,y:0};
let dragOff={x:0,y:0};
let mdNode=null, mdPos={x:0,y:0}, mdTime=0, didDrag=false;
let simSteps=0;

const PALETTE = {
  center:   {fill:'#181410', stroke:'#c9a84c', text:'#e8c76a', glow:'rgba(201,168,76,.22)'},
  umbrella: {fill:'#14121e', stroke:'#7b68ee', text:'#9d8fff', glow:'rgba(123,104,238,.18)'},
  high:     {fill:'#161410', stroke:'#c9a84c', text:'#d4b86a', glow:'rgba(201,168,76,.14)'},
  medium:   {fill:'#111618', stroke:'#4ecdc4', text:'#6bd8d0', glow:'rgba(78,205,196,.12)'},
  low:      {fill:'#131316', stroke:'#666080', text:'#9896a0', glow:'rgba(130,130,160,.08)'},
};

// ══════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════
window.addEventListener('load', ()=>{
  resize();
  window.addEventListener('resize', resize);
  bindEvents();
  loadPersist();
  loadSessions();
  requestAnimationFrame(loop);
});

function resize(){
  W = canvas.width  = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
}

function loadPersist(){
  try{ clickCounts = JSON.parse(localStorage.getItem('ahClicks')||'{}'); }catch(e){}
}
function savePersist(){ localStorage.setItem('ahClicks', JSON.stringify(clickCounts)); }

// ══════════════════════════════════════════
// SESSIONS
// ══════════════════════════════════════════
function loadSessions(){
  try{
    const r = localStorage.getItem('agenticHistorySessions');
    if(r) sessions = JSON.parse(r);
  }catch(e){}
  if(!sessions.length) sessions = demoData();
  buildChips();
  activateSession(0);
  setInterval(()=>{
    try{
      const r=localStorage.getItem('agenticHistorySessions');
      if(!r) return;
      const f=JSON.parse(r);
      if(f.length!==sessions.length){ sessions=f; buildChips(); buildGraph(); document.getElementById('empty').classList.toggle('hidden',nodes.length>0); }
    }catch(e){}
  },3000);
}

function pollSessions(){
  try{
    const r = localStorage.getItem('agenticHistorySessions');
    if(!r) return;
    const f = JSON.parse(r);
    if(f.length !== sessions.length){ sessions=f; buildChips(); activateSession(activeIdx<f.length?activeIdx:0); }
  }catch(e){}
}

function buildChips(){
  const el = document.getElementById('schips');
  el.innerHTML='';
  sessions.forEach((s,i)=>{
    const c=document.createElement('div');
    c.className='schip'+(i===activeIdx?' active':'');
    c.textContent=s.date+' · '+s.className;
    c.onclick=()=>activateSession(i);
    el.appendChild(c);
  });
}

function activateSession(i){
  activeIdx=i;
  buildChips();
  closePanel();
  buildGraph();
  document.getElementById('empty').classList.toggle('hidden', nodes.length>0);
}

// ══════════════════════════════════════════
// GRAPH BUILDING — merges ALL sessions into one persistent map
// ══════════════════════════════════════════
function buildGraph(){
  nodes=[]; edges=[];

  // Merge topics/connections/sources across ALL sessions
  const allTopics=[], allConns=[], allSrcs=[];
  const seenTopics=new Set(), seenConns=new Set(), seenSrcs=new Set();

  sessions.forEach(session=>{
    (session.topics||[]).forEach(t=>{
      if(!seenTopics.has(t.name)){
        seenTopics.add(t.name);
        allTopics.push({...t});
      } else {
        // If topic recurs across sessions, upgrade frequency
        const ex=allTopics.find(x=>x.name===t.name);
        if(ex&&t.frequency==='high') ex.frequency='high';
      }
    });
    (session.connections||[]).forEach(c=>{
      if(!seenConns.has(c)){ seenConns.add(c); allConns.push(c); }
    });
    (session.sources||[]).forEach(s=>{
      if(!seenSrcs.has(s.title)){ seenSrcs.add(s.title); allSrcs.push(s); }
    });
  });

  const className = sessions[0]?.className || 'History Class';
  const savedPos = loadNodePositions();

  // Center node
  addNode('__center__', className, 0, 0, 56, 'center', null, null);

  // Cluster and place
  const clusters = cluster(allTopics, allConns);
  clusters.forEach((cl, ci)=>{
    const angle = (2*Math.PI*ci/clusters.length) - Math.PI/2;
    if(cl.topics.length === 1){
      const t = cl.topics[0];
      const sp = savedPos[t.name];
      const defX=Math.cos(angle)*240, defY=Math.sin(angle)*240;
      const n = addNode(t.name, t.name, sp?sp.x:defX, sp?sp.y:defY, baseR(t.frequency), 'topic', t.frequency, t);
      n.sources = allSrcs.filter(s=>s.topic===t.name);
      n.conns   = allConns.filter(c=>c.toLowerCase().includes(t.name.toLowerCase()));
      edges.push({from:'__center__', to:t.name, kind:'spoke'});
    } else {
      const uid = '__umb_'+ci;
      const sp = savedPos[uid];
      const defX=Math.cos(angle)*195, defY=Math.sin(angle)*195;
      const ub = addNode(uid, cl.label, sp?sp.x:defX, sp?sp.y:defY, 44, 'umbrella', null, null);
      ub.children = cl.topics.map(t=>t.name);
      ub.collapsed = false;
      edges.push({from:'__center__', to:uid, kind:'spoke'});
      cl.topics.forEach((t,ti)=>{
        const sub = angle + (ti-(cl.topics.length-1)/2)*0.52;
        const sd = 350;
        const tp = savedPos[t.name];
        const defTX=Math.cos(sub)*sd, defTY=Math.sin(sub)*sd;
        const n = addNode(t.name, t.name, tp?tp.x:defTX, tp?tp.y:defTY, baseR(t.frequency), 'topic', t.frequency, t);
        n.parentId = uid;
        n.sources  = allSrcs.filter(s=>s.topic===t.name);
        n.conns    = allConns.filter(c=>c.toLowerCase().includes(t.name.toLowerCase()));
        edges.push({from:uid, to:t.name, kind:'child'});
      });
    }
  });

  // Cross-connection edges
  allConns.forEach(c=>{
    const matched = allTopics.filter(t=>c.toLowerCase().includes(t.name.toLowerCase())).map(t=>t.name);
    if(matched.length>=2){
      const [a,b]=[matched[0],matched[1]];
      if(!edges.find(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a)))
        edges.push({from:a, to:b, kind:'conn', label:c});
    }
  });

  applyClickSizes();
  // Only simulate if no saved positions exist yet
  simSteps = Object.keys(savedPos).length > 0 ? 0 : 220;
  document.getElementById('sn').textContent = nodes.length+' nodes';
  document.getElementById('se').textContent = edges.length+' edges';
}

function addNode(id,label,x,y,r,type,freq,data){
  const n={id,label,x,y,vx:0,vy:0,r,baseR:r,type,freq,data,
    clicks:clickCounts[id]||0,collapsed:false,children:[],
    parentId:null,sources:[],conns:[],opacity:1};
  nodes.push(n); return n;
}

function baseR(freq){ return freq==='high'?40:freq==='medium'?30:22; }

function cluster(topics, conns){
  const adj={};
  topics.forEach(t=>{ adj[t.name]=new Set(); });
  conns.forEach(c=>{
    const m=topics.filter(t=>c.toLowerCase().includes(t.name.toLowerCase())).map(t=>t.name);
    if(m.length>=2){ adj[m[0]].add(m[1]); adj[m[1]].add(m[0]); }
  });
  const visited=new Set(), clusters=[];
  topics.forEach(t=>{
    if(visited.has(t.name)) return;
    const neighbors=[...adj[t.name]].filter(n=>!visited.has(n)).map(n=>topics.find(x=>x.name===n)).filter(Boolean);
    if(neighbors.length>=1){
      const group=[t,...neighbors].slice(0,4);
      group.forEach(g=>visited.add(g.name));
      clusters.push({label:umbLabel(group.map(g=>g.name)), topics:group});
    } else {
      visited.add(t.name);
      clusters.push({label:t.name, topics:[t]});
    }
  });
  return clusters;
}

function umbLabel(names){
  const geo=['China','Russia','NATO','Ukraine','Taiwan','War','Conflict','Trade','AI','Climate'];
  for(const w of geo) if(names.some(n=>n.includes(w))) return w+' & Geopolitics';
  return names.sort((a,b)=>a.length-b.length)[0];
}

function applyClickSizes(){
  nodes.forEach(n=>{
    n.clicks = clickCounts[n.id]||0;
    if(n.type==='topic') n.r = n.baseR + Math.min(n.clicks*3, 26);
  });
}

// ══════════════════════════════════════════
// SIMULATION
// ══════════════════════════════════════════
function simTick(){
  if(simSteps<=0) return;
  simSteps--;
  const alpha = Math.max(0.02, simSteps/200);

  // Repulsion
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i]; if(hidden(a)) continue;
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j]; if(hidden(b)) continue;
      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const min=a.r+b.r+70;
      if(d<min){
        const f=(min-d)/d*0.6;
        a.vx-=dx*f; a.vy-=dy*f;
        b.vx+=dx*f; b.vy+=dy*f;
      }
    }
  }

  // Springs
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.from), b=nodes.find(n=>n.id===e.to);
    if(!a||!b||hidden(a)||hidden(b)) return;
    const td=e.kind==='spoke'?230:e.kind==='child'?165:320;
    const dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-td)/d*0.07;
    a.vx+=dx*f; a.vy+=dy*f;
    b.vx-=dx*f; b.vy-=dy*f;
  });

  // Center gravity + integrate
  nodes.forEach(n=>{
    if(hidden(n)||n.type==='center'||n===draggingNode) { n.vx=0; n.vy=0; return; }
    n.vx -= n.x*0.008*alpha;
    n.vy -= n.y*0.008*alpha;
    n.x+=n.vx; n.y+=n.vy;
    n.vx*=0.80; n.vy*=0.80;
  });
}

function hidden(n){ if(!n.parentId) return false; const p=nodes.find(x=>x.id===n.parentId); return p&&p.collapsed; }

// ══════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════
function loop(){ simTick(); draw(); requestAnimationFrame(loop); }

function w2s(x,y){ return {x: x*camZ+W/2+camX, y: y*camZ+H/2+camY}; }
function s2w(x,y){ return {x: (x-W/2-camX)/camZ, y: (y-H/2-camY)/camZ}; }

function draw(){
  ctx.clearRect(0,0,W,H);
  drawGrid();

  // Edges first
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.from), b=nodes.find(n=>n.id===e.to);
    if(!a||!b||hidden(a)||hidden(b)) return;
    drawEdge(a,b,e);
  });

  // Nodes back→front
  [...nodes].filter(n=>!hidden(n)).sort((a,b)=>a.r-b.r).forEach(n=>drawNode(n));
}

function drawGrid(){
  const g=60*camZ;
  const ox=((camX+W/2)%g+g)%g, oy=((camY+H/2)%g+g)%g;
  ctx.strokeStyle='rgba(255,255,255,0.022)'; ctx.lineWidth=0.5;
  ctx.beginPath();
  for(let x=ox-g;x<W+g;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=oy-g;y<H+g;y+=g){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
}

function drawEdge(a,b,e){
  const as=w2s(a.x,a.y), bs=w2s(b.x,b.y);
  ctx.beginPath();
  if(e.kind==='conn'){
    // Cross-connection: bright curved teal line with label
    const mx=(as.x+bs.x)/2, my=(as.y+bs.y)/2;
    const px=-(bs.y-as.y)*0.18, py=(bs.x-as.x)*0.18;
    ctx.moveTo(as.x,as.y);
    ctx.quadraticCurveTo(mx+px,my+py,bs.x,bs.y);
    ctx.strokeStyle='rgba(78,205,196,0.65)'; ctx.lineWidth=1.5;
    ctx.setLineDash([6,5]);
    ctx.stroke(); ctx.setLineDash([]);
    // Draw label at midpoint
    if(e.label && camZ > 0.5){
      const lx=mx+px*0.5, ly=my+py*0.5;
      const words=e.label.replace(/ connects to .* because /i,' → ').substring(0,48);
      ctx.font=`500 ${Math.max(9,10*camZ)}px 'Syne',sans-serif`;
      const tw=ctx.measureText(words).width;
      ctx.fillStyle='rgba(13,13,15,0.75)';
      ctx.beginPath();
      ctx.roundRect(lx-tw/2-5,ly-8,tw+10,16,3);
      ctx.fill();
      ctx.fillStyle='rgba(78,205,196,0.9)';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(words,lx,ly);
    }
  } else if(e.kind==='child'){
    ctx.moveTo(as.x,as.y); ctx.lineTo(bs.x,bs.y);
    ctx.strokeStyle='rgba(123,104,238,0.45)'; ctx.lineWidth=1.2;
    ctx.setLineDash([]); ctx.stroke();
  } else {
    // Spoke from center
    ctx.moveTo(as.x,as.y); ctx.lineTo(bs.x,bs.y);
    ctx.strokeStyle='rgba(201,168,76,0.22)'; ctx.lineWidth=0.8;
    ctx.setLineDash([]); ctx.stroke();
  }
}

function drawNode(n){
  const s=w2s(n.x,n.y), r=n.r*camZ;
  if(r<2) return;
  const isH=hoveredNode&&hoveredNode.id===n.id;
  const isS=selectedNode&&selectedNode.id===n.id;
  const col=PALETTE[n.type==='topic'?(n.freq||'low'):n.type]||PALETTE.low;

  // Glow
  if(isH||isS){
    const g=ctx.createRadialGradient(s.x,s.y,r*.7,s.x,s.y,r*2.4);
    g.addColorStop(0,col.glow); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(s.x,s.y,r*2.4,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
  }

  // Umbrella pulse ring
  if(n.type==='umbrella'){
    const p=0.65+0.35*Math.sin(Date.now()*.0018);
    ctx.beginPath(); ctx.arc(s.x,s.y,r+7*camZ*p,0,Math.PI*2);
    ctx.strokeStyle='rgba(123,104,238,0.13)'; ctx.lineWidth=1.2; ctx.stroke();
  }

  // Main fill
  ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2);
  ctx.fillStyle=col.fill; ctx.fill();
  ctx.strokeStyle=isS?col.text:col.stroke;
  ctx.lineWidth=isS?2:0.9; ctx.stroke();

  // Collapsed dash
  if(n.collapsed&&n.children.length>0){
    ctx.beginPath(); ctx.arc(s.x,s.y,r+3,0,Math.PI*2);
    ctx.strokeStyle=col.stroke; ctx.lineWidth=2; ctx.setLineDash([3,5]); ctx.stroke(); ctx.setLineDash([]);
  }

  // Label
  if(r>7){
    const fs=Math.max(8,Math.min(13,r*.36));
    const w=n.type==='center'?'700':n.type==='umbrella'?'600':'500';
    ctx.font=`${w} ${fs}px 'Syne',sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=(isH||isS)?'#f0eee8':col.text;
    const lines=wrap(n.label, Math.floor(r*1.6/(fs*.55)));
    const lh=fs*1.25, sy=s.y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l, s.x, sy+i*lh));

    // Click badge
    if(n.clicks>0&&r>16){
      const bx=s.x+r*.68, by=s.y-r*.68;
      ctx.beginPath(); ctx.arc(bx,by,8,0,Math.PI*2);
      ctx.fillStyle=col.stroke; ctx.fill();
      ctx.font=`600 8px 'Syne',sans-serif`;
      ctx.fillStyle='#0d0d0f'; ctx.fillText(n.clicks,bx,by);
    }

    // Collapse chevron
    if(n.type==='umbrella'&&r>12){
      ctx.font=`10px sans-serif`; ctx.fillStyle=col.text;
      ctx.fillText(n.collapsed?'▸':'▾', s.x, s.y+r-9);
    }
  }
}

function wrap(text, max){
  const words=text.split(' '), lines=[];
  let cur='';
  words.forEach(w=>{
    const t=(cur?cur+' ':'')+w;
    if(t.length>max&&cur){ lines.push(cur); cur=w; }
    else cur=t;
  });
  if(cur) lines.push(cur);
  return lines.length?lines:[''];
}

// ══════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════
function bindEvents(){
  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('mouseleave',onUp);
  canvas.addEventListener('wheel',onWheel,{passive:false});
  canvas.addEventListener('dblclick',onDbl);
  canvas.addEventListener('touchstart',onTS,{passive:false});
  canvas.addEventListener('touchmove',onTM,{passive:false});
  canvas.addEventListener('touchend',onTE);
}

function nodeAt(mx,my){
  const w=s2w(mx,my);
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i]; if(hidden(n)) continue;
    const dx=w.x-n.x,dy=w.y-n.y;
    if(dx*dx+dy*dy<(n.r+8)*(n.r+8)) return n;
  }
  return null;
}

function onDown(e){
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const hit=nodeAt(mx,my);
  mdTime=Date.now(); mdPos={x:mx,y:my}; mdNode=hit; didDrag=false;
  if(hit){
    const w=s2w(mx,my); dragOff={x:w.x-hit.x,y:w.y-hit.y};
  } else {
    panning=true; panStart={x:e.clientX-camX,y:e.clientY-camY};
    canvas.classList.add('panning');
  }
}

function onMove(e){
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;

  if(mdNode&&!draggingNode){
    const dx=mx-mdPos.x,dy=my-mdPos.y;
    if(dx*dx+dy*dy>18){ draggingNode=mdNode; didDrag=true; canvas.classList.add('ndrag'); }
  }
  if(draggingNode){
    const w=s2w(mx,my); draggingNode.x=w.x-dragOff.x; draggingNode.y=w.y-dragOff.y;
    draggingNode.vx=0; draggingNode.vy=0; return;
  }
  if(panning){ camX=e.clientX-panStart.x; camY=e.clientY-panStart.y; return; }

  const hit=nodeAt(mx,my);
  if(hit!==hoveredNode){
    hoveredNode=hit;
    canvas.style.cursor=hit?'pointer':'grab';
    if(hit) showTip(hit,e.clientX,e.clientY); else hideTip();
  } else if(hit){ moveTip(e.clientX,e.clientY); }
}

function onUp(){
  canvas.classList.remove('panning','ndrag');
  if(draggingNode){ draggingNode=null; mdNode=null; return; }
  if(mdNode&&!didDrag&&Date.now()-mdTime<400) clickNode(mdNode);
  mdNode=null; panning=false;
}

function onDbl(e){
  const r=canvas.getBoundingClientRect();
  const hit=nodeAt(e.clientX-r.left,e.clientY-r.top);
  if(hit&&hit.type==='umbrella') toggleCollapse(hit);
}

function onWheel(e){
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY<0?1.1:0.91;
  const wx=(mx-W/2-camX)/camZ, wy=(my-H/2-camY)/camZ;
  camZ=Math.max(0.15,Math.min(5,camZ*f));
  camX=mx-W/2-wx*camZ; camY=my-H/2-wy*camZ;
}

let ltd=0;
function onTS(e){
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0], r=canvas.getBoundingClientRect();
    const mx=t.clientX-r.left,my=t.clientY-r.top;
    const hit=nodeAt(mx,my);
    mdNode=hit; mdPos={x:mx,y:my}; mdTime=Date.now(); didDrag=false;
    if(hit){ const w=s2w(mx,my); dragOff={x:w.x-hit.x,y:w.y-hit.y}; }
    else{ panning=true; panStart={x:t.clientX-camX,y:t.clientY-camY}; }
  } else if(e.touches.length===2){
    panning=false;
    ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
}
function onTM(e){
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0], r=canvas.getBoundingClientRect();
    const mx=t.clientX-r.left,my=t.clientY-r.top;
    if(mdNode&&!draggingNode){ const dx=mx-mdPos.x,dy=my-mdPos.y; if(dx*dx+dy*dy>18){draggingNode=mdNode;didDrag=true;} }
    if(draggingNode){ const w=s2w(mx,my); draggingNode.x=w.x-dragOff.x; draggingNode.y=w.y-dragOff.y; draggingNode.vx=0;draggingNode.vy=0; }
    else if(panning){ camX=t.clientX-panStart.x; camY=t.clientY-panStart.y; }
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const f=d/ltd;
    const wx=(mx-W/2-camX)/camZ,wy=(my-H/2-camY)/camZ;
    camZ=Math.max(0.15,Math.min(5,camZ*f));
    camX=mx-W/2-wx*camZ; camY=my-H/2-wy*camZ;
    ltd=d;
  }
}
function onTE(){
  if(!didDrag&&mdNode&&Date.now()-mdTime<400) clickNode(mdNode);
  draggingNode=null; panning=false; mdNode=null;
}

// ══════════════════════════════════════════
// CLICK LOGIC
// ══════════════════════════════════════════
function clickNode(n){
  if(n.type==='center') return;
  clickCounts[n.id]=(clickCounts[n.id]||0)+1;
  n.clicks=clickCounts[n.id];
  if(n.type==='topic') n.r=n.baseR+Math.min(n.clicks*3,26);
  savePersist();
  selectedNode=n;
  if(n.type==='umbrella') toggleCollapse(n);
  openPanel(n);
}

function toggleCollapse(n){
  n.collapsed=!n.collapsed;
  simSteps=80;
}

// ══════════════════════════════════════════
// TOOLTIP
// ══════════════════════════════════════════
const tip=document.getElementById('tip');
function showTip(n,cx,cy){
  let t=n.label;
  if(n.type==='umbrella') t+=' — click to '+(n.collapsed?'expand':'collapse')+', drag to move';
  else if(n.data&&n.data.summary) t+='\n'+(n.data.summary).substring(0,90)+'…';
  tip.textContent=t; tip.classList.add('show'); moveTip(cx,cy);
}
function moveTip(cx,cy){ tip.style.left=(cx+16)+'px'; tip.style.top=(cy-8)+'px'; }
function hideTip(){ tip.classList.remove('show'); }

// ══════════════════════════════════════════
// PANEL
// ══════════════════════════════════════════
function openPanel(n){
  document.getElementById('ptag').textContent = n.type==='umbrella'?'Umbrella Topic':'Topic';
  document.getElementById('ptitle').textContent = n.label;

  const meta=document.getElementById('pmeta'); meta.innerHTML='';
  const chip=(text,cls)=>{ const d=document.createElement('div'); d.className='mchip '+cls; d.textContent=text; meta.appendChild(d); };
  if(n.freq) chip(n.freq+' frequency','f'+n.freq[0]);
  if(n.type==='umbrella') chip(n.children.length+' sub-topics','fu');
  if(n.clicks>0) chip(n.clicks+' view'+(n.clicks!==1?'s':''),'fc');

  const body=document.getElementById('pbody'); body.innerHTML='';

  if(n.data&&n.data.summary){
    const s=sec('Summary'); const p=document.createElement('p'); p.className='stext'; p.textContent=n.data.summary; s.appendChild(p); body.appendChild(s);
  }

  if(n.type==='umbrella'&&n.children.length>0){
    const s=sec('Sub-topics'); const g=document.createElement('div'); g.className='spgrid';
    n.children.forEach(cid=>{
      const cn=nodes.find(x=>x.id===cid); if(!cn) return;
      const p=document.createElement('div'); p.className='sppill'; p.textContent=cn.label;
      p.onclick=()=>{ selectedNode=cn; openPanel(cn); };
      g.appendChild(p);
    });
    s.appendChild(g); body.appendChild(s);
  }

  if(n.conns&&n.conns.length>0){
    const s=sec('Connections');
    n.conns.forEach(c=>{ const d=document.createElement('div'); d.className='citem'; d.textContent=c; s.appendChild(d); });
    body.appendChild(s);
  }

  if(n.sources&&n.sources.length>0){
    const s=sec('Sources & Research');
    n.sources.forEach(src=>{
      const c=document.createElement('div'); c.className='srcrd';
      // Make title a clickable search link if no URL provided
      const searchUrl=src.url||`https://www.google.com/search?q=${encodeURIComponent(src.title)}`;
      c.innerHTML=`<div class="stbdg">${src.type}</div>
        <a class="stitle-link" href="${searchUrl}" target="_blank" rel="noopener">${src.title} ↗</a>
        <div class="sdesc">${src.description}</div>`;
      s.appendChild(c);
    });
    body.appendChild(s);
  }

  document.getElementById('panel').classList.add('open');
}

function sec(label){
  const d=document.createElement('div'); d.className='psec';
  const l=document.createElement('div'); l.className='slbl'; l.textContent=label;
  d.appendChild(l); return d;
}

function closePanel(){ document.getElementById('panel').classList.remove('open'); selectedNode=null; }

// ══════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════
function zoomBy(f){ camZ=Math.max(0.15,Math.min(5,camZ*f)); }
function resetView(){ camX=0;camY=0;camZ=1; }

// Save node positions so they persist across reloads
function saveNodePositions(){
  const pos={};
  nodes.forEach(n=>{ pos[n.id]={x:n.x,y:n.y}; });
  localStorage.setItem('ahNodePositions',JSON.stringify(pos));
}

function loadNodePositions(){
  try{ return JSON.parse(localStorage.getItem('ahNodePositions')||'{}'); }catch(e){ return {}; }
}

// Auto-save positions every 3s while dragging settles
setInterval(()=>{ if(nodes.length) saveNodePositions(); }, 3000);
